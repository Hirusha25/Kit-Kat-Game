<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>KitKat · Dunk the Break</title>
<meta name="theme-color" content="#c00a12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/kitkat-oval.png">
<link rel="apple-touch-icon" href="assets/img/kitkat-oval.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,700&family=Figtree:ital,wght@0,500;0,600;0,700;0,900;1,900&family=Urbanist:ital,wght@0,500;0,600;0,700;0,900;1,900&family=Poppins:ital,wght@0,800;1,800;1,900&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Cover is built from the supplied 1125x2000 layers, which share the 9:16 ratio of the 1080x1920 stage,
     so every full-frame layer is placed at 100% x 100% with no resampling beyond the 0.96 stage fit. */
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .scene { animation: sway 6s ease-in-out infinite; transform-origin: 60% 80%; will-change: transform; }
  .scene-video { object-fit: fill; opacity: 0; transition: opacity .8s ease; }
  .scene-video.on { opacity: 1; }
  #scene-still.off { opacity: 0; transition: opacity .8s ease; }
  .ready { position: absolute; left: 80px; top: 786px; margin: 0; font: 700 38px/1.3 var(--font-body); color: #fff; text-shadow: 0 2px 6px rgba(60,0,0,.35); white-space: nowrap; z-index: 1; pointer-events: none; }
  .title { animation: breathe 5s ease-in-out infinite; transform-origin: 36% 30%; will-change: transform; }
  @keyframes breathe { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.025) rotate(-.6deg); } }
  #amb-back, #amb-front { position: absolute; inset: 0; }
  #amb-back canvas, #amb-front canvas { position: absolute; inset: 0; }
  @keyframes sway { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

  /* START: the supplied gold button artwork, floating, with a shine that is clipped to the button shape */
  .start {
    position: absolute; left: 94px; top: 1585px; width: 866px; height: 297px; border: 0; padding: 0; cursor: pointer;
    background: url(assets/img/cover/start-button.webp) center / 100% 100% no-repeat; background-color: transparent;
    animation: float 3.4s ease-in-out infinite; will-change: transform; -webkit-tap-highlight-color: transparent;
  }
  .start::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    -webkit-mask: url(assets/img/cover/start-button.webp) center / 100% 100% no-repeat; mask: url(assets/img/cover/start-button.webp) center / 100% 100% no-repeat;
    background: linear-gradient(105deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 58%);
    background-size: 260% 100%; background-position: 130% 0;
    animation: sweep 3.4s ease-in-out infinite;
  }
  .start::after {
    content: ""; position: absolute; inset: 10% 2%; border-radius: 999px; pointer-events: none;
    box-shadow: 0 0 0 0 rgba(255,215,140,.55); animation: halo 3.4s ease-out infinite;
  }
  .start:active { transform: scale(.97); animation-play-state: paused; }
  .start:focus-visible { outline: 3px solid #fff; outline-offset: 6px; border-radius: 999px; }
  @keyframes sweep { 0% { background-position: 130% 0; } 45% { background-position: -30% 0; } 100% { background-position: -30% 0; } }
  @keyframes halo { 0% { box-shadow: 0 0 0 0 rgba(255,215,140,.55); } 60% { box-shadow: 0 0 0 26px rgba(255,215,140,0); } 100% { box-shadow: 0 0 0 26px rgba(255,215,140,0); } }

  .legal { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 17px; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .enter { animation: fadeIn .7s ease both; }
</style>
</head>
<body class="no-sparks">
<div class="viewport">
  <main class="stage" id="stage">
    <img class="layer" src="assets/img/cover/bg-red-ribbon.webp" alt="" fetchpriority="high">
    <img class="layer enter" style="animation-delay:.05s" src="assets/img/cover/logo.webp" alt="KitKat Chocolate Drink">
    <img class="layer title enter" style="animation-delay:.2s" src="assets/img/cover/title-tagline.webp" alt="Dunk the Break">
    <p class="ready enter" style="animation-delay:.25s">Ready for a chocolate</p>
    <div id="amb-back" class="layer"></div>
    <img class="layer scene enter" id="scene-still" style="animation-delay:.1s" src="assets/img/cover/mug-wafers-wave.webp" alt="">
    <video class="layer scene-video" id="scene-video" muted loop playsinline autoplay preload="auto" poster="assets/video/cover-mug-poster.webp">
      <source src="assets/video/cover-mug-loop.webm" type="video/webm">
    </video>
    <div id="amb-front" class="layer"></div>
    <button class="start enter" id="start" type="button" aria-label="Start" style="animation-delay:.4s"></button>
  </main>
</div>

<script src="js/stage.js"></script>
<script src="js/ambient.js"></script>
<script>
  // .enter plays once, then the continuous float/sway take over.
  document.querySelectorAll('.enter').forEach(el => el.addEventListener('animationend', () => el.classList.remove('enter'), { once: true }));
  // Ambient: slow wafers drifting behind the mug, steam from the cup, gold sparkles in front.
  KKAmbient.create({ stage: document.getElementById('amb-front'), sparkles: 9, sparkleArea: { x0: 60, x1: 1020, y0: 80, y1: 1150 } });
  // Animated mug: transparent WebM over the still artwork; the still stays as the fallback/poster.
  // Safari (and some others) decode VP9 but ignore the alpha channel, which renders as noise, so the video is
  // shown only after a real alpha test: a transparent corner of the first frame must read as transparent.
  (function () {
    const v = document.getElementById('scene-video'), still = document.getElementById('scene-still');
    if (!v) return;
    const ua = navigator.userAgent;
    const isSafari = /Safari/.test(ua) && !/Chrom(e|ium)|Edg|OPR|Android/.test(ua);
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const can = v.canPlayType && v.canPlayType('video/webm; codecs="vp9"');
    if (isSafari || isIOS || !can) { v.remove(); return; }
    let shown = false, failed = false;
    function alphaOk() {
      try {
        const c = document.createElement('canvas'); c.width = 32; c.height = 32; const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(v, 0, 0, 64, 64, 0, 0, 32, 32); // top-left corner of the frame is fully transparent in the source
        const d = g.getImageData(0, 0, 32, 32).data; let a = 0; for (let i = 3; i < d.length; i += 4) a += d[i];
        return a / (d.length / 4) < 40;
      } catch (_) { return true; }
    }
    const show = () => {
      if (shown || failed) return;
      if (!alphaOk()) { failed = true; v.pause(); v.remove(); still.classList.remove('off'); return; }
      shown = true; v.classList.add('on'); still.classList.add('off');
    };
    v.addEventListener('timeupdate', () => { if (v.currentTime > 0.2) show(); });
    v.addEventListener('error', () => { v.remove(); still.classList.remove('off'); });
    const tryPlay = () => v.play().catch(() => {});
    tryPlay(); document.addEventListener('pointerdown', tryPlay, { once: true }); document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
  })();
  document.getElementById('start').addEventListener('click', () => {
    document.body.style.transition = 'opacity .4s';
    document.body.style.opacity = '0';
    setTimeout(() => { location.href = 'register.html'; }, 380);
  });
</script>
</body>
</html>
