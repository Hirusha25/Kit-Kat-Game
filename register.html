<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>Register to play · KitKat Dunk the Break</title>
<meta name="theme-color" content="#c00a12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/kitkat-oval.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,900;1,900&family=Poppins:ital,wght@0,800;1,800;1,900&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Registration screen, matched to the supplied design on the 1080x1920 stage.
     Positions below are the reference's pixel positions scaled to the stage. */
  :root { --kk-red: #c8102e; --cream: #fdf0d6; --cream-deep: #f6dfb0; --brown: #7a4a22; --brown-soft: #8c5a2e; --ring: #e9c98a; }
  body { font-family: "Source Sans 3", "Source Sans Pro", "Segoe UI", Arial, sans-serif; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .logo-top { position: absolute; left: 50%; top: 12px; width: 345px; transform: translateX(-50%); pointer-events: auto; cursor: pointer; }
  .title-top { position: absolute; left: 50%; top: 238px; width: 410px; transform: translateX(-50%); pointer-events: none; }
  #art { pointer-events: none; }
  #amb canvas { position: absolute; inset: 0; }

  .pane { position: absolute; inset: 0; z-index: 1; transition: transform .32s cubic-bezier(.22,1,.36,1); }
  body.kbd-open .pane { transform: translateY(-390px); }
  html.is-phone body.kbd-open .pane { transform: none; }

  .heading {
    position: absolute; left: 0; right: 0; top: 458px; text-align: center; margin: 0; font-family: "Poppins", "Source Sans 3", Arial, sans-serif; font-weight: 900; font-style: italic; font-size: 78px; letter-spacing: 0; text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 0 #f3e4d2, 0 2px 0 #e2cbb3, 0 3px 0 #c9a98c, 0 4px 0 #a9846a, 0 6px 2px rgba(60,0,0,.35), 0 12px 24px rgba(60,0,0,.35);
  }
  @supports (-webkit-background-clip: text) {
    .heading { background: #ffffff; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #c9a98c) drop-shadow(0 8px 14px rgba(60,0,0,.4)); text-shadow: none; }
  }

  .field { position: absolute; left: 75px; width: 930px; margin: 0; }
  .field label { display: block; margin: 0 0 10px; color: #fff; font-weight: 700; font-size: 42px; letter-spacing: 0; text-transform: none; line-height: 1; text-shadow: 0 2px 0 #c9a98c, 0 5px 10px rgba(60,0,0,.35); }
  .field input {
    width: 100%; height: 92px; padding: 0 36px; border-radius: 26px; border: 1px solid rgba(255,255,255,.55);
    background: linear-gradient(180deg, #fffaf0 0%, #fdf1d8 40%, #f8e4bd 100%);
    color: var(--brown); font-family: inherit; font-size: 38px; font-weight: 600; outline: none; caret-color: var(--kk-red);
    box-shadow: inset 0 2px 0 #fff, inset 0 -6px 10px rgba(190,140,70,.22), 0 6px 0 rgba(120,30,20,.28), 0 14px 26px rgba(60,0,0,.3);
    transition: box-shadow .2s, border-color .2s;
  }
  .field input::placeholder { color: var(--brown-soft); font-weight: 600; }
  .field input.active, .field input:focus { border-color: #fff; box-shadow: inset 0 2px 0 #fff, inset 0 -6px 10px rgba(190,140,70,.22), 0 0 0 5px rgba(255,255,255,.5), 0 6px 0 rgba(120,30,20,.28), 0 14px 26px rgba(60,0,0,.3); }
  .field input.invalid { border-color: #ff6b6b; box-shadow: 0 0 0 5px rgba(255,120,120,.4); }
  .field.has-icon input { padding-right: 110px; }
  .field .icon { position: absolute; right: 30px; bottom: 20px; width: 52px; height: 52px; pointer-events: none; }
  .field .icon svg { width: 100%; height: 100%; fill: none; stroke: #6e3f1a; stroke-width: 2.4; stroke-linecap: round; }

  .f-name { top: 588px; } .f-dob { top: 772px; } .f-mobile { top: 956px; } .f-email { top: 1140px; }

  .consent { position: absolute; left: 78px; top: 1316px; width: 930px; margin: 0; display: flex; align-items: flex-start; gap: 24px; color: #fff; font-weight: 400; font-size: 26px; line-height: 1.28; cursor: pointer; text-shadow: 0 1px 3px rgba(60,0,0,.4); }
  .consent .text b { font-weight: 700; }
  .consent .text a { color: #ffe06a; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; pointer-events: none; }
  .consent .box { flex: 0 0 56px; width: 56px; height: 56px; margin-top: 4px; border-radius: 12px; border: 3px solid #fff; background: rgba(255,255,255,.06); display: grid; place-items: center; }
  .consent .box svg { width: 38px; height: 38px; stroke: var(--kk-red); stroke-width: 4; fill: none; opacity: 0; transform: scale(.6); transition: .15s; }
  .consent.on .box { background: #fff; }
  .consent.on .box svg { opacity: 1; transform: scale(1); }

  .err { position: absolute; left: 0; right: 0; top: 1704px; margin: 0; min-height: 0; text-align: center; font-size: 28px; font-weight: 700; color: #ffe1a8; text-shadow: 0 2px 6px rgba(0,0,0,.4); }

  /* Gold pill: the supplied START artwork with its text removed, label drawn on top */
  .btn-cream {
    position: absolute; left: 94px; top: 1434px; width: 866px; height: 297px; border: 0; padding: 0 0 8px; cursor: pointer; background: transparent;
    font-family: "Poppins", "Source Sans 3", Arial, sans-serif; font-weight: 800; font-size: 104px; letter-spacing: .005em; color: #c8102e; text-transform: uppercase; line-height: 1;
    -webkit-tap-highlight-color: transparent; animation: float 3.4s ease-in-out infinite; will-change: transform;
  }
  .btn-cream::after { content: ""; position: absolute; inset: 0; z-index: -1; background: url(assets/img/register/button-blank.webp) center / 100% 100% no-repeat; }
  .btn-cream::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    -webkit-mask: url(assets/img/register/button-blank.webp) center / 100% 100% no-repeat; mask: url(assets/img/register/button-blank.webp) center / 100% 100% no-repeat;
    background: linear-gradient(105deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.8) 50%, rgba(255,255,255,0) 58%); background-size: 260% 100%; background-position: 130% 0;
    animation: sweep 3.4s ease-in-out infinite;
  }
  @keyframes sweep { 0% { background-position: 130% 0; } 45% { background-position: -30% 0; } 100% { background-position: -30% 0; } }
  .btn-cream:active { transform: scale(.98); animation-play-state: paused; }
  .btn-cream:focus-visible { outline: 3px solid #fff; outline-offset: 6px; border-radius: 999px; }

  /* Code reveal */
  #code-view { display: none; }
  #code-view .heading { top: 520px; }
  .ok-name { position: absolute; left: 0; right: 0; top: 640px; text-align: center; color: #fff; font-weight: 700; font-size: 54px; margin: 0; }
  .ok-sub { position: absolute; left: 0; right: 0; top: 760px; text-align: center; color: #ffe1a8; font-weight: 700; font-size: 38px; margin: 0; text-transform: uppercase; letter-spacing: .12em; }
  .code-box { position: absolute; left: 0; right: 0; top: 830px; justify-content: center; margin: 0; }
  .code-box span { width: 112px; height: 150px; border: 3px solid #fff; background: linear-gradient(180deg, #fff6e2, var(--cream-deep)); color: var(--kk-red); font-family: inherit; font-weight: 900; font-size: 92px; }
  .code-box .dash { border: 0; background: none; color: #fff; }
  .ok-note { position: absolute; left: 120px; right: 120px; top: 1020px; text-align: center; color: #fff; font-weight: 600; font-size: 34px; line-height: 1.4; margin: 0; }
  .again { position: absolute; left: 0; right: 0; top: 1700px; text-align: center; color: #fff; font-weight: 700; font-size: 32px; text-decoration: underline; text-underline-offset: 8px; cursor: pointer; }
  .legal { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 17px; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.4); z-index: 2; }
</style>
</head>
<body class="no-sparks">
<div class="viewport">
  <main class="stage">
    <img class="layer" src="assets/img/cover/bg-red-ribbon.webp" alt="" fetchpriority="high">
    <div class="pane" id="art">
      <img class="layer" src="assets/img/register/decor.webp" alt="">
      <div id="amb" class="layer"></div>
      <img class="logo-top" id="home" src="assets/img/register/logo-top.webp" alt="KitKat Chocolate Drink">
      <img class="title-top" src="assets/img/register/title-dunk.webp" alt="Dunk the Break">
    </div>

    <form class="pane" id="reg" novalidate>
      <h1 class="heading fade-in">Register to play</h1>

      <div class="field f-name fade-in" style="animation-delay:.05s">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" data-kbd data-caps="words" maxlength="40" autocomplete="off">
      </div>

      <div class="field f-dob has-icon fade-in" style="animation-delay:.1s">
        <label for="dob">Date of birth</label>
        <input id="dob" name="dob" type="text" inputmode="tel" placeholder="DD / MM / YYYY" data-kbd="numeric" maxlength="14" autocomplete="off">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7.5 14h.01M12 14h.01M16.5 14h.01M7.5 17.5h.01M12 17.5h.01M16.5 17.5h.01" stroke-width="3"/></svg></span>
      </div>

      <div class="field f-mobile fade-in" style="animation-delay:.15s">
        <label for="mobile">Contact number</label>
        <input id="mobile" name="mobile" type="tel" inputmode="tel" placeholder="Enter your mobile number" data-kbd maxlength="10" autocomplete="off">
      </div>

      <div class="field f-email fade-in" style="animation-delay:.2s">
        <label for="email">Email (optional)</label>
        <input id="email" name="email" type="email" placeholder="Enter your email address" data-kbd maxlength="60" autocomplete="off">
      </div>

      <label class="consent fade-in" id="consent" style="animation-delay:.25s">
        <span class="box"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
        <span class="text">I consent to receive offers and be contacted by, or on behalf of, NESTLÉ® via phone, SMS and email about NESTLÉ®, its brands, special offers, consumer research and promotions.<br><b>Privacy Policy:</b> <a href="https://www.nestle.lk/info/privacy-policy">https://www.nestle.lk/info/privacy-policy</a></span>
      </label>
      <p class="err" id="err" role="alert"></p>

      <button class="btn-cream fade-in" id="submit" type="submit" style="animation-delay:.3s">Register</button>
    </form>

    <section class="pane" id="code-view">
      <h1 class="heading">You're in</h1>
      <p class="ok-name" id="ok-name">Thank you</p>
      <p class="ok-sub">Your play code</p>
      <div class="code-box" id="code"></div>
      <p class="ok-note">Keep this code. Enter it on the kiosk to start your break. It stays valid for the next 30 minutes.</p>
      <button class="btn-cream" id="play" type="button">Play now</button>
      <p class="again" id="again">Register another player</p>
    </section>

    <div class="kbd" id="kbd" aria-label="On-screen keyboard"></div>
    <p class="legal">KitKat® Reg. trademark of Société des Produits Nestlé S.A.</p>
  </main>
</div>

<script src="js/stage.js"></script>
<script src="js/ambient.js"></script>
<script src="js/keyboard.js"></script>
<script>
(function () {
  const form = document.getElementById('reg');
  const err = document.getElementById('err');
  const consent = document.getElementById('consent');
  const name = document.getElementById('name'), dob = document.getElementById('dob'), mobile = document.getElementById('mobile'), email = document.getElementById('email');
  let agreed = false;

  consent.addEventListener('pointerdown', e => { e.preventDefault(); agreed = !agreed; consent.classList.toggle('on', agreed); });

  // Date of birth: digits only, shown as DD / MM / YYYY while typing.
  dob.addEventListener('input', () => {
    const d = dob.value.replace(/\D/g, '').slice(0, 8);
    let out = d.slice(0, 2);
    if (d.length > 2) out += ' / ' + d.slice(2, 4);
    if (d.length > 4) out += ' / ' + d.slice(4, 8);
    if (dob.value !== out) dob.value = out;
  });

  // DONE on the keyboard moves to the next empty field.
  const order = [name, dob, mobile, email];
  order.forEach((inp, i) => {
    inp.addEventListener('kbd:done', () => {
      const next = order.slice(i + 1).find(x => !x.value);
      if (next) setTimeout(() => KioskKeyboard.show(next), 60);
    });
    inp.addEventListener('input', () => { inp.classList.remove('invalid'); err.textContent = ''; });
  });

  function validDob(v) {
    const m = v.match(/^(\d{2}) \/ (\d{2}) \/ (\d{4})$/); if (!m) return false;
    const d = +m[1], mo = +m[2], y = +m[3];
    const dt = new Date(y, mo - 1, d); const now = new Date();
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return false;
    const age = now.getFullYear() - y - ((now.getMonth() < mo - 1 || (now.getMonth() === mo - 1 && now.getDate() < d)) ? 1 : 0);
    return age >= 5 && age <= 110;
  }

  function makeCode() {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const a = new Uint32Array(4); crypto.getRandomValues(a);
    return Array.from(a, n => alphabet[n % alphabet.length]).join('');
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    KioskKeyboard.hide();
    err.textContent = '';
    order.forEach(x => x.classList.remove('invalid'));
    const n = name.value.trim(), m = mobile.value.replace(/\D/g, ''), em = email.value.trim();
    if (n.length < 2) { name.classList.add('invalid'); err.textContent = 'Please enter your full name.'; return; }
    if (!validDob(dob.value)) { dob.classList.add('invalid'); err.textContent = 'Please enter your date of birth as DD / MM / YYYY.'; return; }
    if (!/^0?7\d{8}$/.test(m)) { mobile.classList.add('invalid'); err.textContent = 'Please enter a valid mobile number.'; return; }
    if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { email.classList.add('invalid'); err.textContent = 'Please check the email address.'; return; }
    if (!agreed) { err.textContent = 'Please tick the box to agree.'; return; }

    const code = makeCode();
    const player = { name: n, dob: dob.value.replace(/ /g, ''), mobile: m, email: em, code, createdAt: new Date().toISOString() };
    try {
      const q = JSON.parse(localStorage.getItem('kk_players') || '[]'); q.push(player);
      localStorage.setItem('kk_players', JSON.stringify(q));
      sessionStorage.setItem('kk_current', JSON.stringify(player));
    } catch (_) {}

    document.getElementById('ok-name').textContent = n.split(' ')[0] + ', you\'re ready!';
    const box = document.getElementById('code'); box.innerHTML = '';
    const add = (c, cls) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = c; box.appendChild(s); };
    ['B', 'R', 'K'].forEach(c => add(c)); add('–', 'dash'); code.split('').forEach(c => add(c));

    form.style.display = 'none';
    document.getElementById('code-view').style.display = 'block';
  });

  document.getElementById('home').addEventListener('click', () => { location.href = 'index.html'; });
  KKAmbient.create({ stage: document.getElementById('amb'), steam: { x: 880, y: 1690, w: 160, count: 7 }, sparkles: 7, sparkleArea: { x0: 60, x1: 1020, y0: 40, y1: 560 } });
  // Idle: return to the cover after 2 minutes without a touch.
  let idle; const arm = () => { clearTimeout(idle); idle = setTimeout(() => { location.href = 'index.html'; }, 120000); };
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, arm, { passive: true })); arm();
  document.getElementById('again').addEventListener('click', () => location.reload());
  document.getElementById('play').addEventListener('click', () => { location.href = 'game.html'; });
})();
</script>
</body>
</html>
