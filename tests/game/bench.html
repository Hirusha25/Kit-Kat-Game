<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1, user-scalable=no">
<title>Dunk the Break - engine bench</title>
<!--
  Engine benchmark / smoke page. Open directly in a browser (also on the kiosk):
    tests/game/bench.html?seconds=10        synthetic sine input, prints a report
    tests/game/bench.html?manual=1          drive the mug with mouse/touch, no timeout
    &reduced=1  reducedEffects   &difficulty=hard   &seed=123   &duration=20 (round length)
    &input=perfect  scripted player instead of the sine sweep (streaks, gold catches)
  Run headless with:  node tests/game/bench.js
-->
<style>
  html, body { margin: 0; height: 100%; background: #5a0d16; overflow: hidden; font-family: Arial, sans-serif; }
  .stage { position: relative; width: 1080px; height: 1920px; transform-origin: 0 0;
           background: radial-gradient(ellipse at 50% 40%, #b8001c 0%, #7a0012 55%, #45070d 100%); }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .hud { position: absolute; left: 60px; top: 265px; width: 960px; height: 180px; border: 4px solid #e2c270; border-radius: 90px;
         color: #fff; font: 700 64px/180px Arial; text-align: center; letter-spacing: 2px; background: rgba(0,0,0,.25); }
  .slider { position: absolute; left: 140px; right: 140px; top: 1575px; height: 4px; background: #e2c270; }
  .knob { position: absolute; top: -12px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px #e2c270; margin-left: -14px; }
  .caption { position: absolute; left: 0; right: 0; top: 1650px; text-align: center; color: #fff; font: italic 700 44px Arial; }
  #report { position: absolute; left: 40px; top: 40px; color: #fff; font: 28px/1.4 monospace; white-space: pre; text-shadow: 0 2px 4px #000; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" width="1080" height="1920"></canvas>
  <div class="hud" id="hud">TIME 00:45 &nbsp;|&nbsp; SCORE 00</div>
  <div class="slider"><div class="knob" id="knob"></div></div>
  <div class="caption">Catch wafers. Dodge the break-breakers.</div>
  <div id="report">loading sprites...</div>
</div>
<script src="../../js/sprites.js"></script>
<script src="../../js/game.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var seconds = +q.get('seconds') || 10;
  var manual = q.get('manual') === '1';
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = 'scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  var canvas = document.getElementById('game');
  var hud = document.getElementById('hud'), knob = document.getElementById('knob'), report = document.getElementById('report');
  var lastHud = '';

  fetch('../../assets/img/game/manifest.json').then(function (r) { return r.json(); }).then(function (manifest) {
    return DunkSprites.load(manifest, { basePath: '../../', prewarm: ['wafer', 'gold', 'alarm', 'deadline', 'phone', 'orders', 'traffic', 'wafer-piece', 'splash-drop', 'sparkle'] });
  }).then(function (sprites) {
    var frames = [], lastTs = 0, eventCounts = {}, engineMs = 0, engineMax = 0, drawMax = 0;
    var game = DunkGame.create({
      canvas: canvas, sprites: sprites,
      duration: manual ? 45 : (+q.get('duration') || Math.max(seconds + 5, 45)),
      seed: q.get('seed') ? +q.get('seed') : 7,
      difficulty: q.get('difficulty') || 'normal',
      reducedEffects: q.get('reduced') === '1',
      onEvent: function (e) { eventCounts[e.type] = (eventCounts[e.type] || 0) + 1; },
      onTick: function (st) {
        var ts = performance.now();
        if (lastTs) frames.push(ts - lastTs);
        lastTs = ts;
        engineMs += st.stats.frameMs; if (st.stats.frameMs > engineMax) engineMax = st.stats.frameMs;
        if (st.stats.drawCalls > drawMax) drawMax = st.stats.drawCalls;
        var txt = 'TIME 00:' + String(Math.ceil(st.timeLeft)).padStart(2, '0') + '  |  SCORE ' + String(st.score).padStart(2, '0') + '  |  x' + st.streak;
        if (txt !== lastHud) { hud.textContent = txt; lastHud = txt; }
        knob.style.left = (st.mugX01 * 100) + '%';
        if ((frames.length & 15) === 0) {
          report.textContent = 'fps ' + st.stats.fps + '  frame ' + st.stats.frameMs.toFixed(2) + ' ms\n' +
            'items ' + st.stats.items + '  particles ' + st.stats.particles + '  draws ' + st.stats.drawCalls + '\n' +
            'sprites from PNG: ' + Object.keys(sprites).filter(function (k) { return sprites[k].fromImage; }).length + '/' + Object.keys(sprites).length;
        }
      }
    });
    window.__game = game; window.__benchEvents = eventCounts;

    if (manual) {
      var move = function (e) { var p = e.touches ? e.touches[0] : e; var r = canvas.getBoundingClientRect(); game.setTargetX((p.clientX - r.left) / r.width); };
      addEventListener('mousemove', move); addEventListener('touchmove', move, { passive: true });
    } else if (q.get('input') === 'perfect') {
      // Scripted player (same heuristic as tests/game/sim.test.js): chase the lowest good item, side-step hazards.
      var T = DunkGame.TUNING, CH = T.MUG_HALF_WIDTH * T.CATCH_HALF_FRAC, RANGE = T.MUG_MAX_X - T.MUG_MIN_X;
      setInterval(function () {
        var st = game.getState(), items = game.getItems(), wafer = null, bad = null;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          if (it.resolved || it.y > T.MUG_RIM_Y + T.CATCH_BAND) continue;
          if (!it.bad) { if (!wafer || it.y > wafer.y) wafer = it; } else if (!bad || it.y > bad.y) bad = it;
        }
        var target = wafer ? wafer.x : st.mugX;
        if (bad && bad.y > T.MUG_RIM_Y - 420 && (!wafer || bad.y > wafer.y) && Math.abs(bad.x - target) < CH + 40) {
          var side = wafer && wafer.x < bad.x ? -1 : (wafer ? 1 : (bad.x > (T.MUG_MIN_X + T.MUG_MAX_X) / 2 ? -1 : 1));
          target = bad.x + side * (CH + 60);
        }
        game.setTargetX(Math.min(1, Math.max(0, (target - T.MUG_MIN_X) / RANGE)));
      }, 1000 / 30);
    } else {
      // Synthetic tracker: 30 Hz sine sweep with a little noise, like a real player.
      var t0 = performance.now();
      setInterval(function () {
        var t = (performance.now() - t0) / 1000;
        game.setTargetX(0.5 + 0.48 * Math.sin(t * 1.3) + (Math.random() - 0.5) * 0.02);
      }, 1000 / 30);
    }
    game.start();

    window.__benchMidRound = function () { var st = game.getState(); return st.phase === 'playing' && st.elapsed > 0; };
    if (!manual) setTimeout(function () {
      var st = game.getState();
      game.stop();
      var total = frames.reduce(function (a, b) { return a + b; }, 0);
      var avg = total / frames.length;
      var sorted = frames.slice().sort(function (a, b) { return a - b; });
      var p95 = sorted[Math.floor(sorted.length * 0.95)], max = sorted[sorted.length - 1];
      var dropped = frames.filter(function (f) { return f > 16.667 * 1.5; }).length;
      var result = {
        seconds: seconds, frames: frames.length, avgFrameMs: +avg.toFixed(3), fps: +(1000 / avg).toFixed(1),
        p95FrameMs: +p95.toFixed(2), maxFrameMs: +max.toFixed(2), droppedFrames: dropped,
        avgEngineMs: +(engineMs / Math.max(1, frames.length)).toFixed(3), maxEngineMs: +engineMax.toFixed(2), maxDrawCalls: drawMax,
        score: st.score, caught: st.caught, hits: st.hits, missed: st.missed,
        events: eventCounts, spritesFromPng: Object.keys(sprites).filter(function (k) { return sprites[k].fromImage; }).length
      };
      report.textContent = JSON.stringify(result, null, 2);
      window.__benchResult = result;
    }, seconds * 1000);
  }).catch(function (err) {
    report.textContent = 'ERROR ' + (err && err.stack || err);
    window.__benchResult = { error: String(err) };
  });
})();
</script>
</body>
</html>
